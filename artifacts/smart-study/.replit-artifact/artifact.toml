kind = "web"
previewPath = "/smart-study/"
title = "Smart Study Assistant"
version = "1.0.0"
id = "artifacts/smart-study"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/smart-study/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/smart-study run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-study", "run", "build" ]
publicDir = "artifacts/smart-study/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/smart-study/"
